# SPDX-License-Identifier: Apache-2.0
name: Offline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-and-public-snapshot:
    name: Runtime and public snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find runtime lib bin scripts test -type f \( -name '*.js' -o -name '*.cjs' \) -print0 \
            | xargs -0 -n1 node --check
          node --check scripts/check-public-snapshot

      - name: Run runtime offline suite
        run: npm test

      - name: Verify exact-byte public export
        run: npm run verify:export

      - name: Run synthetic Selfsame Protocol probe
        run: node scripts/probe-selfsame-protocol.cjs

      - name: Guard public snapshot
        run: scripts/check-public-snapshot

      - name: Check local Markdown links
        run: node scripts/check-markdown-links.cjs

  console-backend:
    name: Console backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: console/backend/requirements.txt

      - name: Install declared development dependencies
        run: python -m pip install -r console/backend/requirements.txt

      - name: Compile Python source
        run: python -m compileall -q console/backend/tether_console

      - name: Run read-only Console tests
        env:
          PYTHONPATH: console/backend
        run: python -m pytest console/backend/tests/test_tether_console.py

  console-frontend:
    name: Console frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install locked frontend dependencies
        working-directory: console/frontend
        run: pnpm install --frozen-lockfile

      - name: Test, check, and build Console
        working-directory: console/frontend
        run: |
          pnpm test
          pnpm check
          pnpm build
